<!doctype html>
<meta charset="utf-8">
<title>navigation fixtures</title>
<script src="/fixtures/bench.js"></script>
<style>
  body { font: 16px system-ui; margin: 24px; }
  .row { margin: 14px 0; }
  #q-display { font-weight: bold; }
  #top-marker, #bottom-marker { padding: 10px; background: #eef; }
  #spacer { height: 2400px; background: linear-gradient(#fff, #cef); }
</style>

<div id="top-marker" data-bench="top-marker">TOP — query q = <span id="q-display" data-bench="q-display"></span></div>

<div class="row">
  <a data-bench="link-same" href="/fixtures/nav-b.html">go to page B (same tab)</a> ·
  <a data-bench="link-blank" href="/fixtures/nav-b.html" target="_blank" rel="opener">open page B in a new tab</a> ·
  <a data-bench="link-anchor" href="#bottom">jump to #bottom</a>
</div>

<div id="spacer"></div>
<div id="bottom-marker" data-bench="bottom-marker"><a id="bottom" name="bottom"></a>BOTTOM anchor landed here</div>
<div style="height:300px"></div>

<script>
  const params = new URLSearchParams(location.search);
  document.getElementById('q-display').textContent = params.get('q') ?? '(none)';
  // Propagate the run nonce through links so page B reports under the same run.
  const run = params.get('run') || '';
  if (run) {
    for (const a of document.querySelectorAll('a[href^="/fixtures/"]')) {
      const u = new URL(a.href);
      u.searchParams.set('run', run);
      a.href = u.toString();
    }
  }
  window.__benchState = () => ({ q: params.get('q') ?? '', hash: location.hash, pageY: Math.round(scrollY) });
</script>
