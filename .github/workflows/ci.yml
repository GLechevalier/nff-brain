name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx vitest run

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Pack npm tarball
        run: npm pack -w nff-brain
      - name: Package VS Code extension
        run: npx --yes @vscode/vsce package --no-dependencies
        working-directory: packages/vscode
      - uses: actions/upload-artifact@v4
        with:
          name: nff-brain-artifacts
          path: |
            nff-brain-*.tgz
            packages/vscode/*.vsix
