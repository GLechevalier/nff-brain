name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_VSCE_PAT: ${{ secrets.VSCE_PAT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npx vitest run

      - name: Check tag matches package versions
        # Both published packages ship under one tag, so both must agree with it.
        # @nff-brain/core drifting behind would publish a library that does not
        # match the CLI it was cut from.
        run: |
          CLI=$(node -p "require('./packages/cli/package.json').version")
          CORE=$(node -p "require('./packages/core/package.json').version")
          [ "v$CLI" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != nff-brain v$CLI"; exit 1; }
          [ "v$CORE" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != @nff-brain/core v$CORE"; exit 1; }

      # core first: consumers (nff-admin, nff-dashboard, nff-agent-worker) depend
      # on it. The CLI does not — tsup inlines core's sources into its bundle —
      # so this order matters for consumers, not for the CLI tarball.
      - name: Publish core library to npm
        run: npm publish -w @nff-brain/core --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish CLI to npm
        run: npm publish -w nff-brain --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Package VS Code extension
        run: npx --yes @vscode/vsce package --no-dependencies
        working-directory: packages/vscode

      - name: Publish to VS Code Marketplace
        # Requires the VSCE_PAT secret (Azure DevOps token for the publisher).
        if: ${{ env.HAS_VSCE_PAT == 'true' }}
        run: npx --yes @vscode/vsce publish --no-dependencies -p "$VSCE_PAT"
        working-directory: packages/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Attach artifacts to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/vscode/*.vsix
